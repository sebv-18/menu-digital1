<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-b from-slate-950 via-zinc-950 to-black text-white min-h-screen flex flex-col pb-28">

    <!-- EFECTO DE FONDO -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-80 h-32 bg-emerald-500/10 blur-[100px] pointer-events-none"></div>

    <!-- ENCABEZADO -->
    <header class="text-center py-8 px-4 relative z-10">
        <p class="text-emerald-400 font-semibold tracking-widest text-xs mb-2">MENÚ</p>
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200">
            [ NOMBRE DEL LOCAL ]
        </h1>
        <p class="text-slate-400 mt-2 text-sm max-w-xs mx-auto">
            [ Eslogan o descripción del local ]
        </p>
    </header>

    <!-- CATEGORÍAS (Scroll horizontal optimizado para dedo) -->
    <nav class="sticky top-3 z-30 flex gap-2 overflow-x-auto px-4 py-3 bg-slate-900/80 backdrop-blur-md border-y border-slate-800/80 shadow-lg no-scrollbar mb-6">
        <button onclick="filtrarMenu('todos', this)" class="categoria-btn bg-emerald-500 text-slate-950 px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all">Todo</button>
        <button onclick="filtrarMenu('hamburguesas', this)" class="categoria-btn bg-slate-800/80 text-slate-300 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all">Hamburguesas</button>
        <button onclick="filtrarMenu('completos', this)" class="categoria-btn bg-slate-800/80 text-slate-300 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all">Completos</button>
        <button onclick="filtrarMenu('papas', this)" class="categoria-btn bg-slate-800/80 text-slate-300 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all">Papas</button>
        <button onclick="filtrarMenu('bebestibles', this)" class="categoria-btn bg-slate-800/80 text-slate-300 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all">Bebestibles</button>
    </nav>

    <!-- PRODUCTOS (Diseño en una columna ideal para celulares) -->
    <main class="max-w-md mx-auto px-4 flex-grow w-full relative z-10">
        <div id="contenedor-menu" class="space-y-4"></div>
    </main>

    <!-- BOTÓN DEL CARRITO FLOTANTE (Mejor posicionado) -->
    <div class="fixed bottom-5 left-0 right-0 z-40 px-4 flex justify-center pointer-events-none">
        <button onclick="abrirModalCarrito()" class="pointer-events-auto bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold px-6 py-3.5 rounded-full shadow-xl flex items-center gap-3 transition-all active:scale-95 border border-emerald-400/40">
            <i class="fa-solid fa-cart-shopping text-base"></i>
            <span class="text-sm">Ver Carrito</span>
            <span id="contador-carrito" class="bg-slate-950 text-emerald-400 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
    </div>

    <!-- MODAL CARRITO (Optimizado para pantalla completa en móviles) -->
    <div id="modal-carrito" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden justify-end flex-col sm:justify-center sm:items-center sm:p-4">
        <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-3xl w-full sm:max-w-md p-5 shadow-2xl max-h-[85vh] flex flex-col">

            <!-- TÍTULO -->
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping text-emerald-400"></i>
                    Tu Pedido
                </h2>
                <button onclick="cerrarModalCarrito()" class="text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- PRODUCTOS EN EL CARRITO -->
            <div id="lista-carrito-items" class="py-3 space-y-3 overflow-y-auto flex-grow divide-y divide-slate-800/40"></div>

            <!-- TOTAL Y FORMULARIO -->
            <div class="pt-3 border-t border-slate-800 mt-auto">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-slate-400 text-sm font-medium">Total:</span>
                    <span id="carrito-total" class="text-xl font-extrabold text-emerald-400">$0</span>
                </div>

                <!-- NOMBRE -->
                <input type="text" id="cliente-nombre" placeholder="Tu nombre" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white mb-3 focus:outline-none focus:border-emerald-500">

                <!-- TIPO DE ENTREGA -->
                <div class="mb-3">
                    <label class="block text-xs text-slate-400 mb-1.5 font-medium">Tipo de entrega:</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center justify-center gap-2 bg-slate-950 border border-slate-800 rounded-xl p-2.5 cursor-pointer hover:border-emerald-500 transition-all">
                            <input type="radio" name="tipo-entrega" value="retiro" checked onclick="toggleDireccion()" class="accent-emerald-500">
                            <span class="text-xs font-semibold">Retiro local</span>
                        </label>
                        <label class="flex items-center justify-center gap-2 bg-slate-950 border border-slate-800 rounded-xl p-2.5 cursor-pointer hover:border-emerald-500 transition-all">
                            <input type="radio" name="tipo-entrega" value="reparto" onclick="toggleDireccion()" class="accent-emerald-500">
                            <span class="text-xs font-semibold">Reparto</span>
                        </label>
                    </div>
                </div>

                <!-- DIRECCIÓN (Oculta por defecto) -->
                <div id="contenedor-direccion" class="mb-3 hidden">
                    <input type="text" id="cliente-direccion" placeholder="Dirección (Calle, número, depto)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <!-- WHATSAPP -->
                <button onclick="enviarPedidoWhatsApp()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl flex justify-center items-center gap-2 text-sm transition-all shadow-lg active:scale-95">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    Enviar por WhatsApp
                </button>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const productos = [
            { id: 1, nombre: "Hamburguesa Clásica", categoria: "hamburguesas", precio: 5500, descripcion: "Carne de vacuno, queso, lechuga, tomate y salsa de la casa.", imagen: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&auto=format&fit=crop&q=80" },
            { id: 2, nombre: "Hamburguesa Bacon", categoria: "hamburguesas", precio: 6500, descripcion: "Carne, queso cheddar, tocino crujiente y salsa BBQ.", imagen: "https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=600&auto=format&fit=crop&q=80" },
            { id: 3, nombre: "Completo Italiano", categoria: "completos", precio: 3000, descripcion: "Vienesa, tomate, palta y mayonesa.", imagen: "https://images.unsplash.com/photo-1612392062631-94dd858cba88?w=600&auto=format&fit=crop&q=80" },
            { id: 4, nombre: "Completo Dinámico", categoria: "completos", precio: 3500, descripcion: "Vienesa, tomate, palta, chucrut y salsa americana.", imagen: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=600&auto=format&fit=crop&q=80" },
            { id: 5, nombre: "Papas Fritas", categoria: "papas", precio: 3000, descripcion: "Papas fritas crujientes, ideales para acompañar.", imagen: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=600&auto=format&fit=crop&q=80" },
            { id: 6, nombre: "Papas Cheddar", categoria: "papas", precio: 4500, descripcion: "Papas fritas con queso cheddar y tocino.", imagen: "https://images.unsplash.com/photo-1639024471283-03518883512d?w=600&auto=format&fit=crop&q=80" },
            { id: 7, nombre: "Bebida", categoria: "bebestibles", precio: 1500, descripcion: "Bebida en lata de 350 ml.", imagen: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=600&auto=format&fit=crop&q=80" },
            { id: 8, nombre: "Jugo Natural", categoria: "bebestibles", precio: 2000, descripcion: "Jugo natural preparado al momento.", imagen: "https://images.unsplash.com/photo-1613478223719-2ab802602423?w=600&auto=format&fit=crop&q=80" }
        ];

        let carrito = [];

        function mostrarProductos(lista) {
            const contenedor = document.getElementById("contenedor-menu");
            contenedor.innerHTML = "";

            lista.forEach(producto => {
                contenedor.innerHTML += `
                    <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl overflow-hidden shadow-md flex gap-3 p-3 items-center">
                        <img src="${producto.imagen}" alt="${producto.nombre}" class="w-24 h-24 object-cover rounded-xl flex-shrink-0">
                        <div class="flex flex-col flex-grow min-w-0">
                            <h3 class="text-sm font-bold text-white truncate">${producto.nombre}</h3>
                            <p class="text-slate-400 text-xs mt-1 line-clamp-2 leading-relaxed">${producto.descripcion}</p>
                            <div class="mt-2.5 flex justify-between items-center">
                                <span class="text-sm font-extrabold text-emerald-400">$${producto.precio.toLocaleString("es-CL")}</span>
                                <button onclick="agregarAlCarro(${producto.id})" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold transition-all active:scale-95 flex items-center gap-1">
                                    <i class="fa-solid fa-plus text-[10px]"></i> Pedir
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function agregarAlCarro(id) {
            const producto = productos.find(p => p.id === id);
            const existente = carrito.find(p => p.id === id);

            if (existente) {
                existente.cantidad++;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }

            actualizarContador();
        }

        function actualizarContador() {
            const cantidad = carrito.reduce((total, producto) => total + producto.cantidad, 0);
            document.getElementById("contador-carrito").innerText = cantidad;
        }

        function abrirModalCarrito() {
            const lista = document.getElementById("lista-carrito-items");
            lista.innerHTML = "";

            if (carrito.length === 0) {
                lista.innerHTML = `<p class="text-center text-slate-500 py-6 text-sm">Tu carrito está vacío 🛒</p>`;
                document.getElementById("carrito-total").innerText = "$0";
            } else {
                let total = 0;

                carrito.forEach(producto => {
                    const subtotal = producto.precio * producto.cantidad;
                    total += subtotal;

                    lista.innerHTML += `
                        <div class="flex justify-between items-center py-2.5">
                            <div class="min-w-0 pr-2">
                                <p class="font-bold text-xs truncate">${producto.nombre}</p>
                                <p class="text-xs text-slate-400">$${subtotal.toLocaleString("es-CL")}</p>
                            </div>
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <button onclick="cambiarCantidad(${producto.id}, -1)" class="bg-slate-800 text-white w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center">-</button>
                                <span class="text-xs font-semibold w-4 text-center">${producto.cantidad}</span>
                                <button onclick="cambiarCantidad(${producto.id}, 1)" class="bg-slate-800 text-white w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center">+</button>
                            </div>
                        </div>
                    `;
                });

                document.getElementById("carrito-total").innerText = "$" + total.toLocaleString("es-CL");
            }

            document.getElementById("modal-carrito").classList.remove("hidden");
            document.getElementById("modal-carrito").classList.add("flex");
        }

        function cerrarModalCarrito() {
            document.getElementById("modal-carrito").classList.add("hidden");
            document.getElementById("modal-carrito").classList.remove("flex");
        }

        function cambiarCantidad(id, cambio) {
            const producto = carrito.find(p => p.id === id);

            if (producto) {
                producto.cantidad += cambio;
                if (producto.cantidad <= 0) {
                    carrito = carrito.filter(p => p.id !== id);
                }
            }

            actualizarContador();
            abrirModalCarrito();
        }

        function toggleDireccion() {
            const tipoEntrega = document.querySelector('input[name="tipo-entrega"]:checked').value;
            const contenedorDir = document.getElementById("contenedor-direccion");

            if (tipoEntrega === "reparto") {
                contenedorDir.classList.remove("hidden");
            } else {
                contenedorDir.classList.add("hidden");
            }
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Agrega al menos un producto al carrito.");
                return;
            }

            const nombre = document.getElementById("cliente-nombre").value.trim();
            if (!nombre) {
                alert("Ingresa tu nombre.");
                return;
            }

            const tipoEntrega = document.querySelector('input[name="tipo-entrega"]:checked').value;
            let direccion = "";

            if (tipoEntrega === "reparto") {
                direccion = document.getElementById("cliente-direccion").value.trim();
                if (!direccion) {
                    alert("Ingresa tu dirección para el reparto.");
                    return;
                }
            }

            let mensaje = `Hola, soy *${nombre}* y quiero hacer un pedido:%0A%0A`;
            
            if (tipoEntrega === "retiro") {
                mensaje += `🛍️ *Tipo de entrega:* Retiro en local%0A%0A`;
            } else {
                mensaje += `🛵 *Tipo de entrega:* Con reparto%0A📍 *Dirección:* ${direccion}%0A%0A`;
            }

            let total = 0;

            carrito.forEach(producto => {
                const subtotal = producto.precio * producto.cantidad;
                total += subtotal;
                mensaje += `• ${producto.cantidad}x ${producto.nombre} - $${subtotal.toLocaleString("es-CL")}%0A`;
            });

            mensaje += `%0A*Total a pagar: $${total.toLocaleString("es-CL")}*`;

            const numeroWhatsApp = "56912345678"; // Cambia este número por el de tu local
            const url = `https://wa.me/${numeroWhatsApp}?text=${mensaje}`;

            window.open(url, "_blank");
        }

        function filtrarMenu(categoria, boton) {
            document.querySelectorAll(".categoria-btn").forEach(btn => {
                btn.classList.remove("bg-emerald-500", "text-slate-950", "font-bold");
                btn.classList.add("bg-slate-800/80", "text-slate-300", "font-semibold");
            });

            boton.classList.remove("bg-slate-800/80", "text-slate-300", "font-semibold");
            boton.classList.add("bg-emerald-500", "text-slate-950", "font-bold");

            if (categoria === "todos") {
                mostrarProductos(productos);
            } else {
                const filtrados = productos.filter(p => p.categoria === categoria);
                mostrarProductos(filtrados);
            }
        }

        mostrarProductos(productos);
    </script>
</body>
</html>
